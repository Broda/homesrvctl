name: Node container checks
on: [pull_request]
permissions:
  contents: read
jobs:
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Generate applications
        run: |
          mkdir -p ~/.config/homesrvctl
          printf 'sites_root: /tmp/node-stacks\n' > ~/.config/homesrvctl/config.yml
          homesrvctl app init node.example.com --template node
          homesrvctl app init react.example.com --template rust-react-postgres
      - name: Build and validate
        run: |
          set -euo pipefail
          docker build --pull --no-cache -t scaffold-node /tmp/node-stacks/node.example.com
          docker build --pull --no-cache --target build -t scaffold-react-build -f /tmp/node-stacks/react.example.com/frontend/Dockerfile /tmp/node-stacks/react.example.com
          docker run --rm scaffold-react-build npm audit --audit-level=low
          docker build --pull --no-cache -t scaffold-react -f /tmp/node-stacks/react.example.com/frontend/Dockerfile /tmp/node-stacks/react.example.com
          test "$(docker run --rm scaffold-node node --version)" = "v22.23.4"
          docker run -d --name node-check -p 3000:3000 scaffold-node
          docker run -d --name react-check --add-host api:127.0.0.1 -p 8080:80 scaffold-react
          trap 'docker logs node-check; docker logs react-check; docker rm -f node-check react-check' EXIT
          curl --retry 20 --retry-all-errors --retry-delay 1 -fsS http://localhost:3000/healthz | grep '"ok":true'
          curl -fsS http://localhost:3000/ | grep node.example.com
          curl --retry 20 --retry-all-errors --retry-delay 1 -fsS http://localhost:8080/ | grep '/assets/'
          curl -fsS http://localhost:8080/healthz
